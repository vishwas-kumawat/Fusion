###############################################################################
# SPACS (Scholarships & Awards) Module — Workflow Test Designs
# Spec Source: Functional_Requirements/Workflow.docx
# Guide Reference: BackendTestingGuide.md §5.3
#
# Total WFs: 2  |  Min Tests Per WF: 2 (1 E2E + 1 Negative)
# Required WF Tests: 2 × 2 = 4
###############################################################################

workflows:

  - id: "SPACS-WF-101"
    title: "Apply → Verify → Approve/Reject → Grant"
    description: "Handle scholarship application from student submission to final decision and disbursement."
    e2e_tests:
      - scenario: "Student applies → Assistant reviews → Convener approves → Admin disburses"
        expected_final_state: "Application status=DISBURSED; transaction_reference recorded; disbursement_date set"
    negative_tests:
      - scenario: "Student applies → Assistant reviews → Convener rejects"
        expected_final_state: "Application status=REJECTED; no disbursement"

  - id: "SPACS-WF-201"
    title: "Amend / Withdraw Pending"
    description: "Allow students to modify or withdraw pending applications."
    e2e_tests:
      - scenario: "Student applies → Student cancels PENDING application"
        expected_final_state: "Application deleted from system"
    negative_tests:
      - scenario: "Student applies → moves to UNDER_REVIEW → Student tries to cancel"
        expected_final_state: "Cancellation blocked; application remains in UNDER_REVIEW"
