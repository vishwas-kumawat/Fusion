business_rules:

  - id: "BR-SPACS-001"
    title: "Eligibility Must Be Satisfied"
<<<<<<< HEAD
    description: "Ensure only students who meet scholarship-specific eligibility may apply."
    valid_tests:
      - input_action: "POST /spacs/api/applications/ — eligible student (no backlogs, valid category)"
        expected_result: "Application accepted; HTTP 201"
    invalid_tests:
      - input_action: "POST /spacs/api/applications/ — student with backlogs exceeding max_backlogs"
        expected_result: "Rejected with eligibility error; HTTP 422"

  - id: "BR-SPACS-002"
    title: "No Duplicate Applications"
    description: "Prevent students from submitting multiple applications for the same scholarship in the same cycle."
    valid_tests:
      - input_action: "POST /spacs/api/applications/ — first application for scholarship"
        expected_result: "Application created; HTTP 201"
    invalid_tests:
      - input_action: "POST /spacs/api/applications/ — second application for same scholarship/year/semester"
        expected_result: "Rejected; HTTP 409 Conflict; duplicate error"

  - id: "BR-SPACS-003"
    title: "Use of Previously Uploaded Documents"
    description: "Allow reuse of valid previously uploaded documents to reduce student effort."
    valid_tests:
      - input_action: "POST /spacs/api/applications/ with supporting_documents file"
        expected_result: "Application accepted with document; HTTP 201"
    invalid_tests:
      - input_action: "POST /spacs/api/applications/ missing required fields"
        expected_result: "Validation error; HTTP 400"

  - id: "BR-SPACS-004"
    title: "Application Completeness Validation"
    description: "Block incomplete applications from submission."
    valid_tests:
      - input_action: "POST /spacs/api/applications/ with all required fields filled"
        expected_result: "Application accepted; HTTP 201"
    invalid_tests:
      - input_action: "POST /spacs/api/applications/ missing scholarship_type ID"
        expected_result: "Validation error; HTTP 400"

  - id: "BR-SPACS-005"
    title: "Application Review Access"
    description: "Restrict access to application review to authorized SPACS personnel."
    valid_tests:
      - input_action: "GET /spacs/api/applications/ as SPACS assistant — sees all applications"
        expected_result: "All applications returned; HTTP 200"
    invalid_tests:
      - input_action: "GET /spacs/api/applications/ as student — sees only own"
        expected_result: "Only own applications returned; HTTP 200"

  - id: "BR-SPACS-007"
    title: "Draft Save on Timeout or Error"
    description: "Prevent loss of user input due to session timeout or system errors."
    valid_tests:
      - input_action: "POST /spacs/api/applications/ — submitted data persisted in DB"
        expected_result: "Record created and retrievable from DB"
    invalid_tests:
      - input_action: "POST /spacs/api/applications/ with empty payload"
        expected_result: "Validation error; HTTP 400; nothing saved"

  - id: "BR-SPACS-008"
    title: "Notification on Status Change"
    description: "Keep stakeholders informed on application progress."
    valid_tests:
      - input_action: "PATCH status PENDING→UNDER_REVIEW on application"
        expected_result: "Status changed successfully; HTTP 200"
    invalid_tests:
      - input_action: "GET (read-only) on application — no status change"
        expected_result: "No state change; status remains the same"

  - id: "BR-SPACS-009"
    title: "Withdrawal Before Review"
    description: "Allow withdrawal only if review has not started."
    valid_tests:
      - input_action: "DELETE /spacs/api/applications/<pk>/ on PENDING application"
        expected_result: "Application cancelled; HTTP 204"
    invalid_tests:
      - input_action: "DELETE /spacs/api/applications/<pk>/ on UNDER_REVIEW application"
        expected_result: "Rejected; only PENDING applications can be cancelled"

  - id: "BR-SPACS-010"
    title: "Only Owner Can Edit or Withdraw the Application"
    description: "Prevent unauthorized edits or withdrawals."
    valid_tests:
      - input_action: "GET /spacs/api/applications/ as owner — sees own application"
        expected_result: "Own application data returned; HTTP 200"
    invalid_tests:
      - input_action: "GET /spacs/api/applications/ as different student — should not see other student's apps"
        expected_result: "Other student's applications not in result set"

  - id: "BR-SPACS-012"
    title: "Download/Print Access Control"
    description: "Restrict who can download or print application data."
    valid_tests:
      - input_action: "GET /spacs/api/applications/<pk>/ as owning student"
        expected_result: "Full application data returned; HTTP 200"
    invalid_tests:
      - input_action: "GET /spacs/api/applications/ as unauthenticated user"
        expected_result: "HTTP 401 or 403"

  - id: "BR-SPACS-013"
    title: "Escalation & SLA for Reviews"
    description: "Ensure timely processing by reviewers with proper status transitions."
    valid_tests:
      - input_action: "PATCH FORWARDED → APPROVED as convener with amount_approved"
        expected_result: "Status changed to APPROVED; HTTP 200"
    invalid_tests:
      - input_action: "PATCH PENDING → APPROVED (skip intermediate steps)"
        expected_result: "Rejected; invalid status transition"

  - id: "BR-SPACS-014"
    title: "Catalog Versioning & Published Source of Truth"
    description: "Ensure only active/published scholarship types accept applications."
    valid_tests:
      - input_action: "POST /spacs/api/applications/ with is_active=True scholarship type"
        expected_result: "Application accepted; HTTP 201"
    invalid_tests:
      - input_action: "POST /spacs/api/applications/ with is_active=False scholarship type"
        expected_result: "Rejected; scholarship not found (inactive filtered out)"
