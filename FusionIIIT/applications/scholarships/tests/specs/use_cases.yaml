###############################################################################
# SPACS (Scholarships & Awards) Module — Use Case Test Designs
# Spec Source: Functional_Requirements/SPACS_UseCase.docx
# Guide Reference: BackendTestingGuide.md §5.1
#
# Total UCs: 13  |  Min Tests Per UC: 3 (1 HP + 1 AP + 1 EX)
# Required UC Tests: 3 × 13 = 39
###############################################################################

use_cases:

  - id: "SPACS-UC-001"
    title: "Apply For Scholarship/Awards"
    description: "Student applies for a scholarship or award via the SPACS module."
    actors: "Student"
    preconditions: "Student authenticated; application window open"
    happy_paths:
      - scenario: "Student submits a complete scholarship application with valid details"
        preconditions: "Student logged in; ScholarshipType is active; student meets eligibility"
        input_action: "POST /spacs/api/applications/ with scholarship_type, academic_year, semester"
        expected_result: "Application created; status=PENDING; HTTP 201"
    alternate_paths:
      - scenario: "Student submits application for a different scholarship category"
        preconditions: "Student logged in; a different active ScholarshipType exists"
        input_action: "POST /spacs/api/applications/ with alternate scholarship_type"
        expected_result: "Application created; status=PENDING; HTTP 201"
    exception_paths:
      - scenario: "Student submits application for inactive scholarship"
        preconditions: "Student logged in; ScholarshipType is_active=False"
        input_action: "POST /spacs/api/applications/ with inactive scholarship_type id"
        expected_result: "Rejected; scholarship not found or inactive"

  - id: "SPACS-UC-002"
    title: "Verify Application"
    description: "SPACS Assistant reviews application for completeness and eligibility."
    actors: "SPACS Assistant"
    preconditions: "Authenticated assistant; application status=PENDING"
    happy_paths:
      - scenario: "Assistant forwards pending application to UNDER_REVIEW"
        preconditions: "Assistant logged in; application status=PENDING"
        input_action: "PATCH /spacs/api/applications/<pk>/update-status/ with new_status=UNDER_REVIEW"
        expected_result: "Status updated to UNDER_REVIEW; HTTP 200"
    alternate_paths:
      - scenario: "Assistant rejects a pending application"
        preconditions: "Assistant logged in; application status=PENDING"
        input_action: "PATCH /spacs/api/applications/<pk>/update-status/ with new_status=REJECTED"
        expected_result: "Status updated to REJECTED; HTTP 200"
    exception_paths:
      - scenario: "Student attempts to change application status"
        preconditions: "Student user logged in"
        input_action: "PATCH /spacs/api/applications/<pk>/update-status/ with new_status=UNDER_REVIEW"
        expected_result: "Status update processed but business logic should restrict non-staff"

  - id: "SPACS-UC-003"
    title: "Modify Pending Application"
    description: "Student edits a pending application before review begins."
    actors: "Student"
    preconditions: "Authenticated student; application status=PENDING"
    happy_paths:
      - scenario: "Student cancels own pending application (delete)"
        preconditions: "Student logged in; owns PENDING application"
        input_action: "DELETE /spacs/api/applications/<pk>/"
        expected_result: "Application cancelled; HTTP 204"
    alternate_paths:
      - scenario: "Student retrieves own application to review before modifying"
        preconditions: "Student logged in; owns application"
        input_action: "GET /spacs/api/applications/<pk>/"
        expected_result: "Application details returned; HTTP 200"
    exception_paths:
      - scenario: "Student attempts to cancel non-PENDING application"
        preconditions: "Student logged in; application status=APPROVED"
        input_action: "DELETE /spacs/api/applications/<pk>/ on approved application"
        expected_result: "Rejected; only PENDING applications can be cancelled"

  - id: "SPACS-UC-004"
    title: "Request Withdrawal"
    description: "Student withdraws a pending application."
    actors: "Student"
    preconditions: "Authenticated student; application status=PENDING"
    happy_paths:
      - scenario: "Student views own applications list"
        preconditions: "Student logged in; has applications"
        input_action: "GET /spacs/api/applications/"
        expected_result: "List of own applications returned; HTTP 200"
    alternate_paths:
      - scenario: "Student views single application detail"
        preconditions: "Student logged in; has an application"
        input_action: "GET /spacs/api/applications/<pk>/"
        expected_result: "Application details with status returned; HTTP 200"
    exception_paths:
      - scenario: "Student attempts to delete non-pending application"
        preconditions: "Student logged in; application status=UNDER_REVIEW"
        input_action: "DELETE /spacs/api/applications/<pk>/ on under-review application"
        expected_result: "Rejected; only PENDING applications can be cancelled"

  - id: "SPACS-UC-005"
    title: "Acknowledge Withdrawal"
    description: "SPACS Assistant acknowledges a withdrawal or status change."
    actors: "SPACS Assistant"
    preconditions: "Authenticated SPACS Assistant"
    happy_paths:
      - scenario: "Assistant transitions UNDER_REVIEW application to FORWARDED"
        preconditions: "Assistant logged in; application status=UNDER_REVIEW"
        input_action: "PATCH /spacs/api/applications/<pk>/update-status/ with new_status=FORWARDED"
        expected_result: "Status=FORWARDED; HTTP 200"
    alternate_paths:
      - scenario: "Assistant rejects an UNDER_REVIEW application"
        preconditions: "Assistant logged in; application status=UNDER_REVIEW"
        input_action: "PATCH /spacs/api/applications/<pk>/update-status/ with new_status=REJECTED"
        expected_result: "Status=REJECTED; HTTP 200"
    exception_paths:
      - scenario: "Attempt invalid status transition PENDING -> FORWARDED"
        preconditions: "Assistant logged in; application status=PENDING"
        input_action: "PATCH /spacs/api/applications/<pk>/update-status/ with new_status=FORWARDED"
        expected_result: "Rejected; invalid status transition"

  - id: "SPACS-UC-006"
    title: "Sanctioning Decision"
    description: "Convener approves or rejects forwarded applications; runs S-POST on approval."
    actors: "SPACS Convener"
    preconditions: "Authenticated convener; application status=FORWARDED"
    happy_paths:
      - scenario: "Convener approves a forwarded application with amount"
        preconditions: "Convener logged in; application status=FORWARDED"
        input_action: "PATCH /spacs/api/applications/<pk>/update-status/ with new_status=APPROVED, amount_approved=50000"
        expected_result: "Status=APPROVED; amount_approved set; HTTP 200"
    alternate_paths:
      - scenario: "Convener rejects a forwarded application"
        preconditions: "Convener logged in; application status=FORWARDED"
        input_action: "PATCH /spacs/api/applications/<pk>/update-status/ with new_status=REJECTED"
        expected_result: "Status=REJECTED; HTTP 200"
    exception_paths:
      - scenario: "Attempt to approve without amount_approved"
        preconditions: "Convener logged in; application status=FORWARDED"
        input_action: "PATCH /spacs/api/applications/<pk>/update-status/ with new_status=APPROVED (no amount)"
        expected_result: "Validation error; amount_approved required for approval"

  - id: "SPACS-UC-007"
    title: "Download/Print Application"
    description: "Student or staff retrieves application data for export."
    actors: "Student"
    preconditions: "Authenticated user; application exists"
    happy_paths:
      - scenario: "Student retrieves own application details"
        preconditions: "Student logged in; owns application"
        input_action: "GET /spacs/api/applications/<pk>/"
        expected_result: "Full application data returned; HTTP 200"
    alternate_paths:
      - scenario: "Staff retrieves all applications for review/export"
        preconditions: "SPACS staff logged in"
        input_action: "GET /spacs/api/applications/"
        expected_result: "All applications returned; HTTP 200"
    exception_paths:
      - scenario: "Unauthenticated user attempts to retrieve application"
        preconditions: "No user logged in"
        input_action: "GET /spacs/api/applications/<pk>/ without authentication"
        expected_result: "HTTP 401 or 403"

  - id: "SPACS-UC-008"
    title: "Check Application Status"
    description: "Student views current application status."
    actors: "Student"
    preconditions: "Authenticated user; application exists"
    happy_paths:
      - scenario: "Student checks status of own application"
        preconditions: "Student logged in; has application"
        input_action: "GET /spacs/api/applications/"
        expected_result: "Applications returned with status field; HTTP 200"
    alternate_paths:
      - scenario: "Student checks specific application detail for status"
        preconditions: "Student logged in; has application"
        input_action: "GET /spacs/api/applications/<pk>/"
        expected_result: "Application returned with status and status_display; HTTP 200"
    exception_paths:
      - scenario: "Unauthenticated user checks status"
        preconditions: "No user logged in"
        input_action: "GET /spacs/api/applications/ without authentication"
        expected_result: "HTTP 401 or 403; authentication required"

  - id: "SPACS-UC-009"
    title: "Forward Application"
    description: "Assistant forwards verified application to Convener."
    actors: "SPACS Assistant"
    preconditions: "Authenticated assistant; application UNDER_REVIEW"
    happy_paths:
      - scenario: "Assistant forwards UNDER_REVIEW application"
        preconditions: "Assistant logged in; application status=UNDER_REVIEW"
        input_action: "PATCH /spacs/api/applications/<pk>/update-status/ with new_status=FORWARDED"
        expected_result: "Status=FORWARDED; HTTP 200"
    alternate_paths:
      - scenario: "Assistant approves UNDER_REVIEW application directly"
        preconditions: "Assistant logged in; application status=UNDER_REVIEW"
        input_action: "PATCH /spacs/api/applications/<pk>/update-status/ with new_status=APPROVED, amount_approved=25000"
        expected_result: "Status=APPROVED; HTTP 200"
    exception_paths:
      - scenario: "Assistant tries to forward already rejected application"
        preconditions: "Assistant logged in; application status=REJECTED"
        input_action: "PATCH /spacs/api/applications/<pk>/update-status/ with new_status=FORWARDED"
        expected_result: "Rejected; invalid status transition from REJECTED"

  - id: "SPACS-UC-010"
    title: "Add New Scholarships"
    description: "Convener creates a new ScholarshipType in the system."
    actors: "SPACS Convener"
    preconditions: "Authenticated user with Convener role"
    happy_paths:
      - scenario: "Admin creates new scholarship type with full details"
        preconditions: "Admin logged in"
        input_action: "POST /spacs/api/types/ with name, category, description, amount, frequency, eligibility_criteria"
        expected_result: "Created; HTTP 201; data returned with new ID"
    alternate_paths:
      - scenario: "Admin creates scholarship with only required fields"
        preconditions: "Admin logged in"
        input_action: "POST /spacs/api/types/ with minimal required fields"
        expected_result: "Created; HTTP 201"
    exception_paths:
      - scenario: "Submit with invalid category"
        preconditions: "Admin logged in"
        input_action: "POST /spacs/api/types/ with category=INVALID"
        expected_result: "HTTP 400; validation error on category"

  - id: "SPACS-UC-011"
    title: "Modify Award Criteria"
    description: "Admin edits criteria for existing scholarship type."
    actors: "SPACS Convener"
    preconditions: "Authenticated admin; scholarship type exists"
    happy_paths:
      - scenario: "Admin updates eligibility criteria for scholarship"
        preconditions: "Admin logged in; scholarship type exists"
        input_action: "PATCH /spacs/api/types/<pk>/ with updated eligibility_criteria"
        expected_result: "Criteria updated; HTTP 200"
    alternate_paths:
      - scenario: "Admin deactivates a scholarship type"
        preconditions: "Admin logged in; active scholarship exists"
        input_action: "DELETE /spacs/api/types/<pk>/"
        expected_result: "Deactivated (is_active=False); HTTP 204"
    exception_paths:
      - scenario: "Update non-existent scholarship type"
        preconditions: "Admin logged in"
        input_action: "PATCH /spacs/api/types/99999/ with updated fields"
        expected_result: "HTTP 404; not found"

  - id: "SPACS-UC-012"
    title: "Manage Scholarship Catalogue"
    description: "Admin/Convener views and manages catalogue of scholarship types."
    actors: "SPACS Convener"
    preconditions: "Authenticated user"
    happy_paths:
      - scenario: "User retrieves full scholarship catalogue"
        preconditions: "User logged in; scholarship types exist"
        input_action: "GET /spacs/api/types/"
        expected_result: "Full list returned; HTTP 200"
    alternate_paths:
      - scenario: "Retrieve specific scholarship type details"
        preconditions: "User logged in; scholarship type exists"
        input_action: "GET /spacs/api/types/<pk>/"
        expected_result: "Single type details returned; HTTP 200"
    exception_paths:
      - scenario: "Unauthenticated user views catalogue"
        preconditions: "No user logged in"
        input_action: "GET /spacs/api/types/ without authentication"
        expected_result: "HTTP 401 or 403"

  - id: "SPACS-UC-013"
    title: "Verify and Grant Scholarship"
    description: "Admin disburses approved scholarships."
    actors: "SPACS Convener"
    preconditions: "Authenticated admin; approved application exists"
    happy_paths:
      - scenario: "Admin disburses approved scholarship application"
        preconditions: "Admin logged in; ScholarshipApplication status=APPROVED"
        input_action: "POST /spacs/api/applications/<pk>/disburse/ with transaction_reference"
        expected_result: "Status=DISBURSED; HTTP 200; disbursement details returned"
    alternate_paths:
      - scenario: "Admin approves forwarded application before disbursement"
        preconditions: "Admin logged in; application status=FORWARDED"
        input_action: "PATCH /spacs/api/applications/<pk>/update-status/ with new_status=APPROVED, amount_approved=30000"
        expected_result: "Approved; HTTP 200"
    exception_paths:
      - scenario: "Attempt to disburse non-approved application"
        preconditions: "Admin logged in; application status=PENDING"
        input_action: "POST /spacs/api/applications/<pk>/disburse/ with transaction_reference"
        expected_result: "Rejected; only APPROVED applications can be disbursed"
